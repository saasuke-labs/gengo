name: Release

on:
  push:
    tags:
      - "v*.*.*" # Triggers on tags like v1.2.3

permissions:
  contents: write # Needed to upload release assets

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: goreleaser/goreleaser-cross:v1.24

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run GoReleaser
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Rebuild saasuke-labs.com so the new version and release notes show up.
      # Needs the SITE_DISPATCH_TOKEN secret (fine-grained PAT with
      # "Contents: read and write" on saasuke-labs/site-source). Without it the
      # step is skipped and the site catches up on its daily rebuild.
      - name: Announce release to the website
        if: env.SITE_DISPATCH_TOKEN != ''
        continue-on-error: true
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/saasuke-labs/site-source/dispatches \
            -d "{\"event_type\":\"product-release\",\"client_payload\":{\"repo\":\"$GITHUB_REPOSITORY\",\"tag\":\"$TAG\"}}"
